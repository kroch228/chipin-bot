[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "chipin-bot"
version = "0.1.0"
description = "Split-the-bill Telegram bot for group chats"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Chipin Contributors" }]
dependencies = [
    "aiogram>=3.4,<4",
    "sqlalchemy[asyncio]>=2.0,<3",
    "aiosqlite>=0.19",
    "alembic>=1.13",
    "pydantic-settings>=2.0",
    "structlog>=24.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0,<9",
    "pytest-asyncio>=0.24",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Repository = "https://github.com/kroch228/chipin-bot"

[tool.hatch.build.targets.wheel]
packages = ["core", "bot", "migrations"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = false
warn_return_any = true
warn_unused_configs = true
plugins = []

[[tool.mypy.overrides]]
module = ["aiogram.*", "aiosqlite.*"]
ignore_missing_imports = true
